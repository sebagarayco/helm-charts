image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

app:
  command: []
  args: []

azureKeyVaultSecrets:
  enabled: false

mediaWorker:
  enabled: false

mailWorker:
  enabled: false

service:
  targetPort: 8080

persistence:
  enabled: false

probes:
  startup:
    path: /
  readiness:
    path: /
  liveness:
    path: /

test:
  path: /
