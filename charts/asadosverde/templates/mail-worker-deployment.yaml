{{- if .Values.mailWorker.enabled }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- fail "externalDatabase.existingSecret is required when postgresql.enabled is false" }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecretKey) }}
{{- fail "externalDatabase.existingSecretKey is required when postgresql.enabled is false" }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.databaseUrlKey) }}
{{- fail "postgresql.auth.databaseUrlKey is required when postgresql.enabled is true" }}
{{- end }}
{{- $mailSecret := default .Values.app.existingSecret .Values.mailWorker.secret.existingSecret }}
{{- if not $mailSecret }}
{{- fail "mailWorker.secret.existingSecret or app.existingSecret is required when mailWorker.enabled is true" }}
{{- end }}
{{- if not .Values.mailWorker.secret.apiKeyKey }}
{{- fail "mailWorker.secret.apiKeyKey is required when mailWorker.enabled is true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asadosverde.mailWorker.fullname" . }}
  labels:
    {{- include "asadosverde.mailWorker.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "asadosverde.mailWorker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- with omit .Values.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "asadosverde.mailWorker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "asadosverde.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mail-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              ./node_modules/.bin/prisma migrate deploy
              exec ./node_modules/.bin/tsx scripts/mail-retry-worker.ts
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ ternary (include "asadosverde.postgresql.secretName" .) .Values.externalDatabase.existingSecret .Values.postgresql.enabled }}
                  key: {{ ternary .Values.postgresql.auth.databaseUrlKey .Values.externalDatabase.existingSecretKey .Values.postgresql.enabled }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $mailSecret | quote }}
                  key: {{ .Values.mailWorker.secret.apiKeyKey | quote }}
            {{- if .Values.mailWorker.secret.fromEmailKey }}
            - name: RESEND_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $mailSecret | quote }}
                  key: {{ .Values.mailWorker.secret.fromEmailKey | quote }}
                  optional: true
            {{- end }}
            - name: MAIL_RETRY_POLL_MS
              value: {{ .Values.mailWorker.pollMs | quote }}
            - name: MAIL_RETRY_LEASE_MS
              value: {{ .Values.mailWorker.leaseMs | quote }}
            - name: MAIL_RETRY_BATCH_SIZE
              value: {{ .Values.mailWorker.batchSize | quote }}
            - name: MAIL_RETRY_MAX_ATTEMPTS
              value: {{ .Values.mailWorker.maxAttempts | quote }}
          resources:
            {{- toYaml .Values.mailWorker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
