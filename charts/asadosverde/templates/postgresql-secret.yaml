{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $secretName := include "asadosverde.postgresql.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := randAlphaNum 32 }}
{{- if not (empty $existing) }}
{{- if not (kindIs "map" $existing) }}
{{- fail (printf "existing PostgreSQL Secret %q returned an invalid object" $secretName) }}
{{- end }}
{{- if not (hasKey $existing "data") }}
{{- fail (printf "existing PostgreSQL Secret %q is missing data" $secretName) }}
{{- end }}
{{- $existingData := get $existing "data" }}
{{- if not (kindIs "map" $existingData) }}
{{- fail (printf "existing PostgreSQL Secret %q data must be a map" $secretName) }}
{{- end }}
{{- if not (hasKey $existingData .Values.postgresql.auth.passwordKey) }}
{{- fail (printf "existing PostgreSQL Secret %q is missing password key %q" $secretName .Values.postgresql.auth.passwordKey) }}
{{- end }}
{{- $encodedPassword := index $existingData .Values.postgresql.auth.passwordKey }}
{{- if not (kindIs "string" $encodedPassword) }}
{{- fail (printf "existing PostgreSQL Secret %q password key %q must be a base64 string" $secretName .Values.postgresql.auth.passwordKey) }}
{{- end }}
{{- if or (empty $encodedPassword) (not (regexMatch "^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$" $encodedPassword)) }}
{{- fail (printf "existing PostgreSQL Secret %q password key %q must contain valid non-empty base64 data" $secretName .Values.postgresql.auth.passwordKey) }}
{{- end }}
{{- $password = $encodedPassword | b64dec }}
{{- end }}
{{- $databaseUrl := printf "postgresql://%s:%s@%s:%v/%s" .Values.postgresql.auth.username $password (include "asadosverde.postgresql.fullname" .) .Values.postgresql.service.port .Values.postgresql.auth.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "asadosverde.postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgresql.auth.passwordKey }}: {{ $password | quote }}
  {{ .Values.postgresql.auth.databaseUrlKey }}: {{ $databaseUrl | quote }}
{{- end }}
