{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $secretName := include "asadosverde.postgresql.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := randAlphaNum 32 }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.postgresql.auth.passwordKey) }}
{{- $password = index $existing.data .Values.postgresql.auth.passwordKey | b64dec }}
{{- end }}
{{- $databaseUrl := printf "postgresql://%s:%s@%s:%v/%s" .Values.postgresql.auth.username $password (include "asadosverde.postgresql.fullname" .) .Values.postgresql.service.port .Values.postgresql.auth.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "asadosverde.postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgresql.auth.passwordKey }}: {{ $password | quote }}
  {{ .Values.postgresql.auth.databaseUrlKey }}: {{ $databaseUrl | quote }}
{{- end }}
