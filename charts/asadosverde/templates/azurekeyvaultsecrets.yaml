{{- if .Values.azureKeyVaultSecrets.enabled }}
{{- if not .Values.azureKeyVaultSecrets.apiVersion }}
{{- fail "azureKeyVaultSecrets.apiVersion is required when azureKeyVaultSecrets.enabled is true" }}
{{- end }}
{{- $resourceNames := dict }}
{{- range $index, $secret := .Values.azureKeyVaultSecrets.secrets }}
{{- $prefix := printf "azureKeyVaultSecrets.secrets[%d]" $index }}
{{- $vaultName := default $.Values.azureKeyVaultSecrets.vaultName $secret.vaultName }}
{{- $object := default (dict) $secret.object }}
{{- $output := default (dict) $secret.output }}
{{- $azureIdentity := default (dict) $secret.azureIdentity }}
{{- $labels := omit (default (dict) $secret.labels) "helm.sh/chart" "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/version" "app.kubernetes.io/managed-by" "app.kubernetes.io/component" }}
{{- if not $secret.name }}
{{- fail (printf "%s.name is required" $prefix) }}
{{- end }}
{{- $resourceName := toString $secret.name }}
{{- if hasKey $resourceNames $resourceName }}
{{- fail (printf "%s.name %q duplicates azureKeyVaultSecrets.secrets[%v].name" $prefix $resourceName (get $resourceNames $resourceName)) }}
{{- end }}
{{- $_ := set $resourceNames $resourceName $index }}
{{- if not $vaultName }}
{{- fail (printf "%s.vaultName or azureKeyVaultSecrets.vaultName is required" $prefix) }}
{{- end }}
{{- if not $object.name }}
{{- fail (printf "%s.object.name is required" $prefix) }}
{{- end }}
{{- if not $object.type }}
{{- fail (printf "%s.object.type is required" $prefix) }}
{{- end }}
{{- if not (has $object.type (list "secret" "certificate" "key" "multi-key-value-secret")) }}
{{- fail (printf "%s.object.type must be one of secret, certificate, key, or multi-key-value-secret" $prefix) }}
{{- end }}
{{- if not $output.name }}
{{- fail (printf "%s.output.name is required" $prefix) }}
{{- end }}
{{- if eq $object.type "multi-key-value-secret" }}
{{- if not $object.contentType }}
{{- fail (printf "%s.object.contentType is required for multi-key-value-secret" $prefix) }}
{{- end }}
{{- if not (has $object.contentType (list "application/x-json" "application/x-yaml")) }}
{{- fail (printf "%s.object.contentType must be application/x-json or application/x-yaml for multi-key-value-secret" $prefix) }}
{{- end }}
{{- else if and (or (not $output.type) (eq (lower $output.type) "opaque")) (not $output.dataKey) }}
{{- fail (printf "%s.output.dataKey is required for a single-value Opaque Secret" $prefix) }}
{{- end }}
{{- if hasKey $secret "transforms" }}
{{- if not (kindIs "slice" $secret.transforms) }}
{{- fail (printf "%s.transforms must be a list" $prefix) }}
{{- end }}
{{- range $transformIndex, $transform := $secret.transforms }}
{{- if not (kindIs "string" $transform) }}
{{- fail (printf "%s.transforms[%d] must be a string" $prefix $transformIndex) }}
{{- end }}
{{- if not (has $transform (list "trim" "base64encode" "base64decode")) }}
{{- fail (printf "%s.transforms[%d] must be one of trim, base64encode, or base64decode" $prefix $transformIndex) }}
{{- end }}
{{- end }}
{{- end }}
{{- if hasKey $output "chainOrder" }}
{{- if not (kindIs "string" $output.chainOrder) }}
{{- fail (printf "%s.output.chainOrder must be a string" $prefix) }}
{{- end }}
{{- if and $output.chainOrder (ne $output.chainOrder "ensureserverfirst") }}
{{- fail (printf "%s.output.chainOrder must be ensureserverfirst when set" $prefix) }}
{{- end }}
{{- end }}
---
apiVersion: {{ $.Values.azureKeyVaultSecrets.apiVersion | quote }}
kind: AzureKeyVaultSecret
metadata:
  name: {{ $resourceName | quote }}
  labels:
    {{- with $labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- include "asadosverde.azureKeyVaultSecret.labels" $ | nindent 4 }}
  {{- with $secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  vault:
    name: {{ $vaultName | quote }}
    {{- with $azureIdentity.name }}
    azureIdentity:
      name: {{ . | quote }}
    {{- end }}
    object:
      name: {{ $object.name | quote }}
      type: {{ $object.type | quote }}
      {{- with $object.version }}
      version: {{ . | quote }}
      {{- end }}
      {{- with $object.contentType }}
      contentType: {{ . | quote }}
      {{- end }}
  output:
    {{- with $secret.transforms }}
    transform:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    secret:
      name: {{ $output.name | quote }}
      {{- with $output.type }}
      type: {{ . | quote }}
      {{- end }}
      {{- with $output.dataKey }}
      dataKey: {{ . | quote }}
      {{- end }}
      {{- with $output.chainOrder }}
      chainOrder: {{ . | quote }}
      {{- end }}
{{- end }}
{{- end }}
